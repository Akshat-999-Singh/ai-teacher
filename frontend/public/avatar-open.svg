<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="440" height="440" rx="24"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171B"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4A52"/>
      <stop offset="1" stop-color="#1D353B"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="440" height="440" fill="url(#bg)"/>

    <!-- soft halo -->
    <circle cx="220" cy="196" r="150" fill="#F0AC5F" opacity="0.05"/>

    <!-- shoulders -->
    <path d="M78 440 C 82 356, 140 322, 220 322 C 300 322, 358 356, 362 440 Z" fill="url(#shirt)"/>
    <path d="M186 326 L220 372 L254 326 L244 320 L220 348 L196 320 Z" fill="#ECE6DA" opacity="0.92"/>
    <path d="M220 372 L212 400 L220 414 L228 400 Z" fill="#F0AC5F" opacity="0.85"/>

    <!-- neck -->
    <path d="M196 268 h48 v54 c0 14 -48 14 -48 0 Z" fill="#C99169"/>
    <path d="M196 268 h48 v22 c-16 12 -34 10 -48 -2 Z" fill="#B07F5B"/>

    <!-- head -->
    <ellipse cx="220" cy="186" rx="86" ry="98" fill="#E0A97C"/>

    <!-- ears -->
    <ellipse cx="134" cy="192" rx="12" ry="18" fill="#D49C70"/>
    <ellipse cx="306" cy="192" rx="12" ry="18" fill="#D49C70"/>

    <!-- hair -->
    <path d="M132 168 C 130 100, 168 70, 220 70 C 272 70, 310 100, 308 168
             C 300 140, 286 126, 262 122 C 240 138, 200 140, 174 128
             C 152 134, 140 146, 132 168 Z" fill="#2E2823"/>

    <!-- brows -->
    <path d="M168 156 q 22 -12 44 -2" stroke="#2E2823" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M228 154 q 22 -10 44 2" stroke="#2E2823" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- eyes -->
    <ellipse cx="190" cy="184" rx="15" ry="16" fill="#FFFFFF"/>
    <ellipse cx="250" cy="184" rx="15" ry="16" fill="#FFFFFF"/>
    <circle cx="192" cy="185" r="7.5" fill="#3A2A20"/>
    <circle cx="252" cy="185" r="7.5" fill="#3A2A20"/>
    <circle cx="194.5" cy="182" r="2.6" fill="#FFFFFF"/>
    <circle cx="254.5" cy="182" r="2.6" fill="#FFFFFF"/>

    <!-- nose -->
    <path d="M220 192 q -7 20 2 26 q 6 4 12 -1" stroke="#C08A60" stroke-width="5"
          stroke-linecap="round" fill="none"/>

    <!-- MOUTH: open -->
    <ellipse cx="220" cy="250" rx="21" ry="16" fill="#7A3A30"/>
    <path d="M203 244 q 17 -9 34 0 q -17 6 -34 0 Z" fill="#FFFFFF" opacity="0.92"/>
    <ellipse cx="220" cy="261" rx="11" ry="6" fill="#B85C52" opacity="0.9"/>

    <!-- glasses -->
    <g stroke="#F0AC5F" stroke-width="4.5" fill="none" opacity="0.95">
      <rect x="164" y="164" width="54" height="42" rx="12"/>
      <rect x="222" y="164" width="54" height="42" rx="12"/>
      <path d="M218 182 h4"/>
      <path d="M164 178 l-26 6"/>
      <path d="M276 178 l26 6"/>
    </g>
  </g>
</svg>
